[project]
name = "sector-rotation-idx-backend"
version = "1.0.0"
description = "Sector Rotation IDX — backend FastAPI + SQLite (single-user, lokal)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "pyyaml",
    "pandas",
    "numpy",
    "yfinance",
    "openpyxl",
    "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

# Paket `backend.*` hidup di root repo (bukan di folder ini), karena CLI dijalankan
# dari root: `python -m backend.cli`. package-dir memetakan nama paket ke folder ini.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "backend" = "." }
packages = ["backend", "backend.app", "backend.api", "backend.ingest", "backend.tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
