[project]
name = "sector-rotation-idx-backend"
version = "1.0.0"
description = "Sector Rotation IDX — backend FastAPI + SQLite (single-user, lokal)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "pyyaml",
    "pandas",
    "numpy",
    "yfinance",
    "openpyxl",
    "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "pytest-xdist"]   # xdist: suite penuh jalan paralel (ADR-046)

# Paket `backend.*` hidup di root repo (bukan di folder ini), karena CLI dijalankan
# dari root: `python -m backend.cli`. package-dir memetakan nama paket ke folder ini.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "backend" = "." }
packages = [
    "backend",
    "backend.app",
    "backend.app.api",
    "backend.app.compute",
    "backend.app.ingest",
    "backend.app.repo",
    "backend.tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: pipeline penuh / ingest multi-batch / run nyata kecil — dilewati di loop cepat (pytest -m 'not slow')",
  "integration: uji lewat HTTP async + polling run",
]
