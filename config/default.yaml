# config/default.yaml — SATU-SATUNYA tempat angka ambang.
# Jangan hardcode angka dari file ini di dalam kode. Backend membacanya,
# frontend menerimanya lewat GET /api/v1/meta/config.
# Setiap perubahan di sini WAJIB dicatat di docs/DECISIONS.md.

app:
  name: "Sector Rotation IDX"
  timezone: "Asia/Jakarta"
  api_version: "1.0"

database:
  path: "data/rotation.db"
  journal_mode: "WAL"
  busy_timeout_ms: 5000

universe:
  # Path file master sektor→saham (root repo, sudah ada; 11 sheet, 962 emiten).
  excel_path: "saham_sektoral.xlsx"
  # Bobot indeks sektor yang dipakai default: equal | turnover | captier
  # (captier pakai kolom "Saham" dari Excel × harga → tidak butuh panggilan .info)
  weighting: "equal"
  # Kecualikan papan Pemantauan Khusus dari kandidat sinyal (tetap tampil di tabel,
  # ditandai badge "PK"). Risiko: saham PK sering di-suspend & likuiditas palsu.
  exclude_pemantauan_khusus: true
  # Ambang likuiditas: rata-rata nilai transaksi harian minimum (Rp) selama 20 hari bursa.
  # Gunanya: menyaring saham yang tidak bisa ditransaksikan dalam jumlah wajar —
  # tanpa filter ini, saham "mati" (turnover Rp 5 juta/hari) bisa lolos rule momentum
  # dan tampil sebagai kandidat, padahal mustahil masuk/keluar posisi tanpa menggerakkan harga.
  # 1 M = Rp 1.000.000.000. Ini TEBAKAN AWAL — sesuaikan (mis. 5 M untuk lebih konservatif,
  # 500 jt kalau kamu sanggup main di saham tipis). Ubah angkanya, jangan ubah namanya.
  min_turnover_idr: 1000000000
  # Harga minimum (Rp). Gunakan 50 bila kamu memang mau ikut saham gocap
  # (tick size besar, risiko likuiditas tinggi, banyak saham Rp 50 nyangkut).
  min_price_idr: 100
  # Batas RSI agar tidak masuk saat sudah overbought (rule saham mingguan).
  max_rsi: 75
  # Jumlah konstituen minimum supaya indeks sektor dianggap layak dihitung.
  min_constituents: 3
  # Bagian minimum emiten aktif yang harus sudah punya bar harian sebelum tombol
  # "Hitung semua" boleh jalan (prasyarat 409 prereq_no_prices di docs/05 §4.1).
  # 0.5 = setengah universe. Ini TEBAKAN AWAL — turunkan kalau kamu mau menghitung
  # lebih awal dengan data seadanya, naikkan kalau ingin memastikan data lengkap dulu.
  min_prices_coverage: 0.5

ingest:
  daily_lookback_days: 730          # 2 tahun riwayat harian
  intraday_intervals: ["5m", "60m"]
  intraday_history_days: 30         # batas retensi bar intraday
  batch_size: 50                    # ticker per panggilan yf.download
  sleep_seconds: 1.0                # jeda antar batch (sopan ke Yahoo)
  retries: 3
  backoff_seconds: 3
  refresh_market_cap_days: 7        # umur cache market cap sebelum ambil .info lagi
  benchmark_ticker: "^JKSE"         # IHSG
  benchmark_alias: "IHSG"           # nama yang dipakai di tabel price_daily

# Watchlist untuk gate kesegaran data (docs/02 §5). Pilih saham paling likuid:
# kalau data mereka belum sampai, data saham lain juga belum bisa dipercaya.
freshness_probe_tickers: ["BBCA.JK", "BBRI.JK", "BMRI.JK", "TLKM.JK", "ASII.JK"]

midday:
  # Bar terakhir (dari probe) harus >= jam ini agar perhitungan tengah hari dijalankan.
  # Jam sesi 1 IDX: 09:00–12:00 WIB. Delay feed Yahoo belum terukur —
  # ukur nyata selama 3 hari bursa lalu setel nilai ini (docs/02 §5).
  gate_min_bar_time: "11:30"
  retry_interval_minutes: 10
  gate_deadline_time: "13:00"       # lewat ini, job midday dibatalkan & dicatat
  # Ambang "datar" untuk label arah intraday sektor.
  move_flat_pct: 0.0015
  include_post_session_bars: false  # bar 16:00-16:15 (post-trading) tidak dipakai hitung

rrg:
  ema_span: 14
  roc_lag: 10
  # Warmup minimum PER TIMEFRAME (satuan bar timeframe itu sendiri).
  # Harian  : EMA 14 + SMA(EMA) 14 + ROC 10 → 60 bar harian (~3 bulan bursa).
  # Mingguan: EMA 14 minggu + SMA(EMA) 14 minggu + ROC 4 minggu → 30 bar MINGGU (~7 bulan bursa).
  # Ini yang menentukan berapa lama riwayat harus ditarik — lihat docs/02 §7.
  min_points:
    d1: 60
    w1: 30
    w1_fri: 30
    midday: 60
  normalize_base: 100
  weekly:
    ema_span: 14
    roc_lag: 4                      # 4 minggu
  quadrants: ["leading", "weakening", "lagging", "improving"]

timeframes:
  default: "d1"
  allowed: ["d1", "w1", "w1_fri", "midday"]
  weekly_close_dow: "FRI"           # minggu Senin–Jumat, label tanggal Jumat

windows:
  default: "3m"
  allowed: ["1w", "1m", "3m", "6m", "1y", "ytd"]
  # Jendela TIDAK mengubah parameter RRG (ema_span/roc_lag tetap) — hanya panjang ekor & kolom return.

scoring:
  sector:
    weight_rs_ratio: 0.35
    weight_rs_momentum: 0.25
    weight_return_window: 0.20      # return periode acuan (return_window: 4 minggu)
    weight_turnover_growth: 0.20
    penalty_decline_from: 0.40      # share saham decline di atas ini mulai kena penalti
    penalty_decline_weight: 0.25
  stock:
    weight_rs_ratio: 0.40
    weight_return_5d: 0.30
    weight_turnover: 0.30
  return_window_weeks: 4
  turnover_short_days: 20
  turnover_long_days: 60

# Analisa teknikal & backtest moving average (docs/03 §10). Semua harga = adj_close
# (bukan `close` mentah: aksi korporasi membuat lompatan palsu — 801 bar >30% pada 293 emiten di DB dev).
ta:
  ma_periods: [10, 20, 50]          # SMA yang dihitung & dilaporkan; MA50 dipakai juga sebagai filter tren
  ma_default: 20                    # periode yang tampil pertama di UI (bukan klaim "terbaik" — itu urusan data)
  trend_filter: true                # true = event hanya dihitung bila harga juga di atas MA periode tren
  trend_filter_period: 50
  target_pct: 0.05                  # ambang ±5% (docs/03 §10.3)
  timeout_periods: 60               # periode bursa maksimum setelah entry; lewat ini → status `expired`
  min_history: 60                   # minimum bar sebelum emiten/sektor ikut diuji (MA + horizon)
  entry_basis: "next_open"          # next_open (saham) | next_index_close (sektor/indeks tidak punya open)
  report_filter_variants: true      # laporkan hasil dengan & tanpa filter tren supaya bisa dibandingkan

weekly:
  max_sectors: 3
  max_stocks_per_sector: 3
  min_quadrant_age_periods: 2
  atr_stop_mult: 1.5
  rr_target: 2.0
  # Sinyal akhir minggu (`w1_fri`) hanya boleh dihitung setelah penutupan Jumat.
  # Sebelum jam ini di hari Jumat → 409 gate_weekly_not_final; Sabtu/Minggu selalu boleh.
  final_after_time: "16:15"
  # Risiko per posisi untuk saran jumlah lot (lot = 100 lembar).
  risk_per_trade_idr: 2000000
  require_sektor_kandidat: true     # saham hanya dipilih dari sektor kandidat
  # Trading plan berbasis analisa teknikal (docs/03 §6.4). Semua level dihitung backend dari
  # harga penyesuaian; alasan tiap elemen disusun rule-based dari angka ini.
  plan:
    pivot_bars: 5                     # pivot = high/low dengan N bar kiri & kanan lebih rendah/tinggi
    channel_tol_pct: 0.01             # toleransi pengelompokan pivot jadi kanal S/R (±1%)
    donchian_fast: 20                 # high/low N bar terakhir → level breakout & resistance terdekat
    donchian_slow: 40                 # target terukur (measured move) jangka lebih panjang
    swing_low_bars: 10                # low terendah N bar → dasar stop struktural
    zone_atr: 0.3                     # lebar zona entry = ±0,3 × ATR14 di sekitar level
    stop_buffer_atr: 0.5              # penyangga di bawah level struktur (biar tidak kena sentuhan)
    min_stop_atr: 1.0                 # stop tidak boleh lebih ketat dari 1 × ATR14 (noise intraday)
    max_stop_pct: 0.08                # stop lebih lebar dari 8% → PERINGATAN (bukan penolakan), lihat B18c
    max_stop_atr: 3.0                 # batas efektif = max(max_stop_pct, max_stop_atr × ATR/harga) — adaptif volatilitas
    volume_mult: 1.5                  # konfirmasi volume untuk entry breakout (× rata-rata 20 bar)
    chase_atr: 2.0                    # harga > 2 × ATR di atas SMA20 → jangan chase, tunggu pullback
    ma_slope_bars: 5                  # "SMA20 menanjak" = SMA20 sekarang > SMA20 N bar lalu (docs/03 §6.4.0)
    rsi_range_max: 40                 # rezim range: konfirmasi `rsi_tepi_range` = RSI ≤ ini di tepi bawah kanal
    rr_min_tp2: 3.0                   # TP2 wajib memberi reward:risk minimal 3:1
    tp1_fallback_atr: 1.5             # TP1 kalau tidak ada resistance di atas entry
    min_events_hold: 5                # minimal event TA sebelum median lama tahan ditampilkan
    min_events_scenario: 10           # minimal event sebelum skenario peluang ditampilkan (di bawah ini → null)
    # Biaya transaksi (basis poin). R:R dihitung SETELAH biaya; RR bruto membuat target dekat
    # terlihat lebih baik daripada kenyataannya. 15 + 25 bps = 0,15% beli + 0,25% jual
    # (komisi broker + levy + pajak jual). SESUAIKAN dengan brokermu.
    fee_buy_bps: 15
    fee_sell_bps: 25
    # Gerbang rezim (docs/03 §6.4.0)
    range_ma_gap: 0.02                # |SMA20−SMA50|/close ≤ ini → rezim `range`
    thin_zero_volume: 0.2             # share bar volume-0 dalam 20 bar → rezim `tipis`
    thin_stop_mult: 1.0               # buffer tambahan (× ATR) untuk stop di saham tipis
    # --- Zona entry (revisi 14 Okt 2026): acuan berkonfluensi + lebar adaptif ---
    zone_touch_atr: 0.25               # harga ≤ ini × ATR14 di atas batas atas zona → tetap dianggap "di zona" (menempel)
    # --- Picks terkurasi: GET /api/v1/plan/picks (aturan saring 14 Okt 2026, docs/05 §2) ---
    picks_limit: 3                     # jumlah picks default
    picks_max_limit: 10                # batas atas ?limit= (jangan sampai endpoint jadi dump 962 emiten)
    picks_atr_max_pct: 0.06            # ATR14 maksimum terhadap harga — di atas ini stop terlalu lebar untuk swing
    picks_zone_max_atr: 0.70           # lebar zona maksimum (× ATR14) — zona lebih lebar dari ini bukan titik masuk
    picks_stop_max_pct: 0.10           # stop maksimum terhadap harga
    picks_tp_artifact_pct: 0.30        # target > ini × harga → ditandai `artefak` (acuan kanal jauh, bukan target swing)
    zone_atr: 0.35                    # setengah lebar zona = ±0,35 × ATR14 dari pusat zona
    zone_min_pct: 0.006               # lantai setengah lebar = 0,6% harga (ATR kecil tidak bikin zona terlalu sempit)
    zone_thin_mult: 2.0               # saham tipis: level "kabur" → zona digandakan
    anchor_tol_atr: 0.5               # dua acuan dianggap satu zona bila jaraknya ≤ 0,5 × ATR
    anchor_min_count: 2               # minimal acuan berkumpul; kurang dari ini → pakai acuan rezim saja
    retrace_ratios: [0.382, 0.5, 0.618]  # koreksi Fibonacci leg 40-bar sebagai acuan tambahan
    zone_near_atr: 1.0                # jarak (harga − batas atas zona)/ATR ≤ ini → status `mendekati`
    zone_far_atr: 3.0                 # di atas ini → status `jauh`/`sangat_jauh`
    # --- Gerbang kelayakan plan (docs/03 §6.4.7) ---
    min_turnover_idr: 2000000000      # likuiditas minimum (Rp2 M/hari) — di bawah ini plan_ok=false
    min_events_plan: 8                # minimal kejadian TA di `ta_breakout` sebelum plan dianggap layak
    min_win_rate_plan: 0.55           # minimal win-rate sistem MA saham itu sendiri
    sector_gate_weightings: [equal, turnover, captier]  # gerbang sektor dinilai di beberapa bobot
    sector_gate_min_pass: 2           # minimal berapa bobot menyatakan memimpin/memperbaiki

briefing:
  # docs/05 §3: regime risk_off bila sectors_down ≥ ambang, risk_on bila sectors_up ≥ ambang.
  regime_sector_threshold: 7
  top_n_default: 3

retention:
  intraday_days: 30
  midday_rrg_days: 60
  plan_days: 60                     # riwayat `stock_plan` yang disimpan (docs/03 §6.5)
  vacuum_min_file_mb: 200

api:
  host: "127.0.0.1"
  port: 8000
  cors_origins: ["http://localhost:5173", "http://127.0.0.1:5173"]
  cache_ttl_seconds: 60
  api_key: ""                       # kosong = /admin/* terbuka (single-user lokal)
  backup_enabled: true

market:
  # Kutipan IHSG di halaman Overview (GET /api/v1/meta/market?live=true).
  # HANYA IHSG (benchmark) — emiten/sektor lain tidak punya jalur kutipan live.
  live_enabled: true
  # Cache kutipan live (detik). N tab browser dalam jendela ini = 1 request ke Yahoo.
  # Jangan di bawah 30 (sopan ke Yahoo, dan feed IDX delay-nya lebih besar dari ini).
  live_ttl_seconds: 60
  # Interval poll di frontend (detik) — dibaca UI dari /meta/config.
  poll_seconds: 60
  # Ambang "datar" untuk label arah intraday IHSG.
  move_flat_pct: 0.0005

chart:
  # Grafik candle di halaman detail saham (docs/06 §6.5). Overlay mengikuti rezim (docs/03 §6.4.0).
  window_bars: 120                  # jumlah bar harian yang digambar
  volume_ma: 20                     # rata-rata volume untuk garis & ambang konfirmasi
  events: 20                        # maksimum penanda event breakout yang dikirim
  channel_min_strength: 2           # kanal S/R hanya digambar bila punya ≥ N pivot
  # Lapisan v2 (docs/03 §11) — semua dihitung backend, dipilih user lewat toggle di grafik.
  ursi:
    len: 14
    method: "sma"                   # rma|ema|sma|tma — `rma` = RSI klasik; `sma`/`tma` lebih halus (penekanan tren)
    signal_len: 7
    ob: 70                          # ambang "tren kuat" (bukan sinyal jual)
    os: 30
  vwap:
    len: 20                         # jendela VWAP harian
    band: [1.0, 2.0]                # kelipatan σ untuk pita
    anchor: "rolling"               # rolling | pivot_low | quarter
  poc:
    bins: 24                        # jumlah bucket harga
    bars: 60                        # jendela profil
    value_area: 0.7                 # porsi volume untuk value area
    basis: "daily"                  # daily (dilabeli "perkiraan") | intraday (butuh bar 5m tersimpan)
  smc:
    enabled: false                  # default mati: lapisan konteks, bukan aturan plan (docs/03 §11.4)
    eq_tol_pct: 0.01                # toleransi equal high/low
  elliott:
    enabled: false                  # default mati: kandidat, tidak reproducible (docs/03 §11.5)
    min_move: 0.03                  # jarak minimum antar pivot ZigZag (3%)

logging:
  level: "INFO"
  keep_days: 14
